<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Shooter — волны зомби</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #355a26; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; cursor: crosshair; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: radial-gradient(ellipse at center, rgba(30,10,10,.55), rgba(0,0,0,.85));
    color: #fff; z-index: 10; text-align: center; pointer-events: none;
  }
  #overlay h1 { font-size: 64px; letter-spacing: 4px; color: #e04343; text-shadow: 0 0 30px #b00, 0 4px 0 #000; margin-bottom: 8px; }
  #overlay h2 { font-size: 40px; color: #ffd25e; text-shadow: 0 0 20px #a80; margin-bottom: 8px; }
  #overlay p { font-size: 18px; color: #ddd; line-height: 1.7; max-width: 640px; }
  #overlay p b { color: #fff; }
  #overlay .keys { display: flex; gap: 24px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  #overlay .key { font-size: 14px; color: #aaa; }
  #overlay .key kbd {
    display: inline-block; padding: 4px 10px; margin-right: 6px; border-radius: 6px;
    background: #222; border: 1px solid #555; border-bottom-width: 3px; color: #fff;
    box-shadow: 0 2px 0 #000; font-size: 13px;
  }
  #overlay button {
    pointer-events: auto; cursor: pointer; font-size: 22px; font-weight: 700;
    padding: 14px 52px; border: 0; border-radius: 12px; margin-top: 12px;
    background: linear-gradient(#e04343, #a02424); color: #fff;
    box-shadow: 0 6px 0 #5a1010, 0 10px 30px rgba(224,67,67,.4);
    transition: transform .06s, box-shadow .06s;
  }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #5a1010, 0 14px 34px rgba(224,67,67,.55); }
  #overlay button:active { transform: translateY(3px); box-shadow: 0 3px 0 #5a1010; }
  #overlay.hidden { display: none; }
  #hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.35); font-size: 13px; z-index: 5; pointer-events: none; }
  #crosshair { position: fixed; width: 18px; height: 18px; pointer-events: none; z-index: 6; }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #fff; mix-blend-mode: difference;
  }
  #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="crosshair"></div>
<div id="overlay">
  <h1>ЗОМБИ<br>ШУТЕР</h1>
  <p id="ov-sub">Волны зомби атакуют сверху</p>
  <p>
    Истребляй зомби, выживай как можно дольше.<br>
    С каждой волной монстры становятся сильнее и разнообразнее.
  </p>
  <div class="keys">
    <span class="key"><kbd>W A S D</kbd> движение</span>
    <span class="key"><kbd>ЛКМ</kbd> автомат (зажать)</span>
    <span class="key"><kbd>R</kbd> перезарядка</span>
    <span class="key"><kbd>G</kbd> / <kbd>ПКМ</kbd> бросок гранаты</span>
  </div>
  <button id="startBtn">ИГРАТЬ</button>
</div>
<div id="hint">Аптечки ➕ патроны 🧨 гранаты выпадают из зомби. Собирай, подойдя вплотную.</div>
<script>
"use strict";

// ================= CANVAS =================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ================= AUDIO (синтез) =================
let AC = null;
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function blip(freq, dur, type, vol, slideTo) {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur);
}
function noise(dur, vol, lpFreq) {
  if (!AC) return;
  const t = AC.currentTime;
  const len = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const g = AC.createGain(); g.gain.value = vol || 0.2;
  let node = src;
  if (lpFreq) {
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lpFreq;
    src.connect(f); node = f;
  }
  node.connect(g); g.connect(AC.destination); src.start(t);
}
const sfx = {
  shot()    { noise(0.08, 0.18, 3000); blip(180, 0.08, 'sawtooth', 0.05, 60); },
  reload()  { blip(300, 0.04, 'square', 0.06, 500); setTimeout(() => blip(500, 0.04, 'square', 0.06, 350), 120); },
  empty()   { blip(140, 0.05, 'square', 0.05, 90); },
  zombieHit(){ blip(110 + Math.random() * 60, 0.06, 'sawtooth', 0.08, 40); },
  zombieDie(){ blip(90, 0.25, 'sawtooth', 0.14, 30); noise(0.2, 0.1, 800); },
  playerHit(){ blip(60, 0.15, 'square', 0.2, 45); noise(0.12, 0.15, 400); },
  explode() { noise(0.6, 0.5, 1200); blip(70, 0.4, 'sawtooth', 0.25, 25); },
  pickup()  { blip(523, 0.08, 'triangle', 0.18); setTimeout(() => blip(784, 0.12, 'triangle', 0.18), 90); },
  throwNade(){ blip(200, 0.1, 'sine', 0.1, 500); },
  waveStart(){ blip(196, 0.15, 'sawtooth', 0.15); setTimeout(() => blip(247, 0.15, 'sawtooth', 0.15), 150); setTimeout(() => blip(294, 0.25, 'sawtooth', 0.15), 300); },
};

// ================= INPUT =================
const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false, rDown: false };
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR') reload();
  if (e.code === 'KeyG') throwGrenade();
});
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; const ch = document.getElementById('crosshair'); ch.style.left = (e.clientX - 9) + 'px'; ch.style.top = (e.clientY - 9) + 'px'; });
window.addEventListener('mousedown', e => { audio(); if (e.button === 0) mouse.down = true; if (e.button === 2) { mouse.rDown = true; throwGrenade(); } });
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; if (e.button === 2) mouse.rDown = false; });
window.addEventListener('contextmenu', e => e.preventDefault());

// ================= GAME CONST =================
const WORLD = 2200;                    // размер мира
const PLAYER_R = 16;
const PLAYER_SPEED = 260;
const MAG_SIZE = 30;
const FIRE_INTERVAL = 0.09;           // скорострельный автомат
let gameState = 'menu';

// ================= ENTITIES =================
let player;
let zombies = [];
let bullets = [];
let enemyBullets = [];
let grenades = [];
let explosions = [];
let pickups = [];
let particles = [];
let decals = [];   // пятна крови
let texts = [];    // всплывающие цифры

let wave = 0;
let score = 0;
let kills = 0;
let waveActive = false;
let spawnQueue = [];
let waveTimer = 0;
let spawnTimer = 0;
let restTimer = 0;
let shake = 0;
let flash = 0;
let time = 0;
let pendingBoss = false;
let bossLevel = 0;
let boss = null;

function resetGame() {
  player = {
    x: WORLD / 2, y: WORLD / 2,
    vx: 0, vy: 0,
    hp: 100, maxHp: 100,
    angle: 0,
    mag: MAG_SIZE,
    magMax: MAG_SIZE,
    grenades: 3,
    reloading: false,
    reloadT: 0,
    cd: 0,
    fireAnim: 0,
    invuln: 0,
  };
  zombies = []; bullets = []; enemyBullets = [];
  grenades = []; explosions = []; pickups = [];
  particles = []; decals = []; texts = [];
  wave = 0; score = 0; kills = 0;
  waveActive = false; spawnQueue = [];
  pendingBoss = false; bossLevel = 0; boss = null;
  shake = 0; flash = 0;
  startWave();
}

// ================= WAVES =================
const TYPE = {
  walker:  { color: '#5f9e4f', r: 16, hp: 30,  speed: 62,  dmg: 9,  score: 10, name: 'Зомби' },
  runner:  { color: '#8fc43a', r: 13, hp: 18,  speed: 150, dmg: 6,  score: 15, name: 'Бегун' },
  brute:   { color: '#3e7a4a', r: 26, hp: 130, speed: 40,  dmg: 22, score: 40, name: 'Брут' },
  spitter: { color: '#7a4f9e', r: 15, hp: 38,  speed: 70,  dmg: 0,  score: 25, name: 'Плевальщик' },
  exploder:{ color: '#c8472f', r: 15, hp: 26,  speed: 110, dmg: 0,  score: 20, name: 'Бомбер' },
};

const WAVE_PRESETS = [
  ['walker'],
  ['walker', 'runner'],
  ['walker', 'runner', 'brute'],
  ['walker', 'runner', 'spitter'],
  ['walker', 'runner', 'brute', 'spitter'],
  ['runner', 'brute', 'exploder'],
  ['walker', 'runner', 'brute', 'spitter', 'exploder'],
];

function buildWave(n) {
  const preset = WAVE_PRESETS[Math.min(n - 1, WAVE_PRESETS.length - 1)];
  const count = Math.floor(8 + n * 2.6);
  const list = [];
  for (let i = 0; i < count; i++) {
    let t = preset[Math.floor(Math.random() * preset.length)];
    if (n >= 4 && Math.random() < 0.1) t = 'spitter';
    if (n >= 5 && Math.random() < 0.12) t = 'exploder';
    list.push({ t });
  }
  return list;
}

function startWave() {
  wave++;
  waveActive = false;
  restTimer = 60;
  tick = 0;
  globHpMul = 1 + (wave - 1) * 0.22;
  globSpMul = 1 + Math.min((wave - 1) * 0.03, 0.5);
  spawnQueue = buildWave(wave);
  spawnTimer = 0;
  texts.push({ x: player.x, y: player.y - 60, txt: 'ВОЛНА ' + wave, life: 2.2, color: '#ffd25e', big: true });
  sfx.waveStart();
}

function spawnZombie(type) {
  const def = TYPE[type];
  const a = Math.random() * Math.PI * 2;
  const dist = 600 + Math.random() * 400;
  const x = Math.max(30, Math.min(WORLD - 30, player.x + Math.cos(a) * dist));
  const y = Math.max(30, Math.min(WORLD - 30, player.y + Math.sin(a) * dist));
  zombies.push({
    type, x, y, vx: 0, vy: 0,
    hp: def.hp * globHpMul,
    maxHp: def.hp * globHpMul,
    speed: def.speed * globSpMul,
    r: def.r,
    color: def.color,
    dmg: def.dmg,
    score: def.score,
    hurt: 0,
    spitCd: 1.2 + Math.random() * 2,
    wander: Math.random() * Math.PI * 2,
    wanderT: Math.random() * 3,
    wob: Math.random() * Math.PI * 2,
    deathT: -1,
  });
}
let globHpMul = 1, globSpMul = 1;

function updateWave(dt) {
  restTimer -= dt;
  if (!waveActive && zombies.length === 0 && spawnQueue.length === 0) {
    if (restTimer <= 0) {
      if (pendingBoss) {
        pendingBoss = false;
        spawnBoss();
      } else {
        startWave();
      }
    }
    return;
  }
  if (spawnQueue.length) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = 0.5;
      // выпускаем по чуть-чуть за раз (чтобы волна была "волной")
      const batch = Math.min(spawnQueue.length, 1 + Math.floor(wave / 3));
      for (let i = 0; i < batch; i++) spawnZombie(spawnQueue.pop().t);
      if (spawnQueue.length === 0) { waveActive = true; }
    }
  } else if (waveActive && zombies.length === 0) {
    // волна зачищена — бонус и пауза
    waveActive = false;
    restTimer = 3.0;
    const bonus = wave * 50;
    score += bonus;
    texts.push({ x: player.x, y: player.y - 60, txt: 'ВОЛНА ' + wave + ' ЗАЧИЩЕНА! +' + bonus, life: 2.2, color: '#7dff7d', big: true });
    sfx.pickup();
    if ((wave + 1) % 5 === 0) {
      pendingBoss = true;
      texts.push({ x: player.x, y: player.y - 100, txt: '⚠ БОСС ПРИБЛИЖАЕТСЯ ⚠', life: 2.6, color: '#ff5555', big: true });
    }
  }
}

function spawnBoss() {
  bossLevel++;
  const dist = 750;
  const a = Math.random() * Math.PI * 2;
  const x = Math.max(60, Math.min(WORLD - 60, player.x + Math.cos(a) * dist));
  const y = Math.max(60, Math.min(WORLD - 60, player.y + Math.sin(a) * dist));
  const second = bossLevel % 2 === 0;
  const scale = 1 + (bossLevel - 1) * 0.55;
  const def = second ? BOSS_SPITTER : BOSS_BRUTE;
  boss = {
    type: 'boss',
    boss: true,
    bKind: second ? 'spitter' : 'brute',
    name: (second ? 'ПОВЕЛИТЕЛЬ ПЛЕВКИ' : 'ТИТАН'), 
    x, y, vx: 0, vy: 0,
    hp: def.hp * scale,
    maxHp: def.hp * scale,
    speed: def.speed,
    r: def.r,
    color: def.color,
    dmg: def.dmg,
    score: def.score,
    hurt: 0,
    atkT: 2.5,
    telegraph: 0,
    pendingAtk: null,
    wob: Math.random() * Math.PI * 2,
    deathT: -1,
  };
  zombies.push(boss);
  waveActive = true;
  texts.push({ x: player.x, y: player.y - 60, txt: (second ? 'ПОВЕЛИТЕЛЬ ПЛЕВКИ' : 'ТИТАН') + ' — УРОВЕНЬ ' + bossLevel, life: 3, color: '#ff5555', big: true });
  sfx.waveStart();
  setTimeout(() => { blip(120, 0.4, 'sawtooth', 0.25, 40); noise(0.5, 0.3, 900); }, 300);
}

const BOSS_BRUTE = {
  color: '#2f8f4a', r: 44, hp: 1500, speed: 46, dmg: 30, score: 400,
};
const BOSS_SPITTER = {
  color: '#8a4fb0', r: 34, hp: 1100, speed: 64, dmg: 18, score: 350,
};

// ================= PLAYER =================
function updatePlayer(dt) {
  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }
  player.vx += (dx * PLAYER_SPEED - player.vx) * Math.min(1, dt * 12);
  player.vy += (dy * PLAYER_SPEED - player.vy) * Math.min(1, dt * 12);
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x = Math.max(PLAYER_R, Math.min(WORLD - PLAYER_R, player.x));
  player.y = Math.max(PLAYER_R, Math.min(WORLD - PLAYER_R, player.y));

  // цель по мыши (в мировых координатах)
  const mx = mouse.x + cam.x;
  const my = mouse.y + cam.y;
  player.angle = Math.atan2(my - player.y, mx - player.x);

  player.invuln = Math.max(0, player.invuln - dt);
  if (player.fireAnim > 0) player.fireAnim -= dt;
  player.cd -= dt;

  if (player.reloading) {
    player.reloadT -= dt;
    if (player.reloadT <= 0) {
      player.reloading = false;
      // патроны бесконечные — магазин сам пополняется
      player.mag = player.magMax;
      sfx.reload();
    }
  }

  // стрельба из автомата
  if (mouse.down && !player.reloading && player.cd <= 0) {
    if (player.mag > 0) {
      player.cd = FIRE_INTERVAL;
      player.mag--;
      player.fireAnim = 0.07;
      fireBullet();
      if (player.mag === 0) reload();
    } else {
      player.cd = 0.4;
      sfx.empty();
    }
  }

  // подбор дропа
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    if (Math.hypot(player.x - p.x, player.y - p.y) < PLAYER_R + p.r + 4) {
      applyPickup(p);
      sfx.pickup();
      pickups.splice(i, 1);
    }
  }
}

function reload() {
  if (player.reloading || player.mag >= player.magMax) return;
  player.reloading = true;
  player.reloadT = 1.1;
}

function fireBullet() {
  const speed = 760;
  const a = player.angle + (Math.random() - 0.5) * 0.03;
  bullets.push({
    x: player.x + Math.cos(a) * (PLAYER_R + 10),
    y: player.y + Math.sin(a) * (PLAYER_R + 10),
    vx: Math.cos(a) * speed,
    vy: Math.sin(a) * speed,
    life: 1.4, r: 3, dmg: 12,
  });
  sfx.shot();
  // гильза
  const ea = player.angle;
  particles.push({ x: player.x, y: player.y, vx: Math.cos(ea + 1.7) * 180, vy: Math.sin(ea + 1.7) * 180, life: 0.5, r: 2, color: '#e8b24a', grav: 0, fade: 1, type: 'shell' });
  // дульная вспышка искр
  for (let i = 0; i < 3; i++) {
    const la = player.angle + (Math.random() - 0.5) * 0.8;
    particles.push({ x: bullets[bullets.length-1].x, y: bullets[bullets.length-1].y, vx: Math.cos(la) * (200 + Math.random() * 300), vy: Math.sin(la) * (200 + Math.random() * 300), life: 0.12, r: 2, color: '#ffd25e', grav: 0, fade: 1 });
  }
  flash = 0.03;
}

function throwGrenade() {
  if (gameState !== 'play') return;
  if (player.grenades <= 0) { sfx.empty(); return; }
  player.grenades--;
  const a = player.angle;
  const speed = 520;
  grenades.push({
    x: player.x + Math.cos(a) * 26,
    y: player.y + Math.sin(a) * 26,
    vx: Math.cos(a) * speed + player.vx * 0.3,
    vy: Math.sin(a) * speed + player.vy * 0.3,
    fuse: 1.1,
    bounces: 0,
  });
  sfx.throwNade();
}

function explode(x, y) {
  explosions.push({ x, y, r: 0, maxR: 150, life: 0.4, dmg: 85, color: '#ff8a3c' });
  sfx.explode();
  shake = Math.max(shake, 10);
  flash = Math.max(flash, 0.12);
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 420;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3 + Math.random() * 0.4, r: 3 + Math.random() * 3, color: Math.random() < 0.5 ? '#ff8a3c' : '#ffd25e', grav: 0, fade: 1 });
  }
  // урон по зомби
  for (const z of zombies) {
    const d = Math.hypot(z.x - x, z.y - y);
    if (d < 145 && z.deathT < 0) {
      const dmg = explosions[explosions.length-1].dmg * (1 - d / 165);
      damageZombie(z, dmg, 'explosion');
    }
  }
  // урон по игроку
  const pd = Math.hypot(player.x - x, player.y - y);
  if (pd < 110) damagePlayer(30 * (1 - pd / 130));
}

function damagePlayer(d) {
  if (player.invuln > 0) return;
  player.hp -= d;
  player.invuln = 0.4;
  shake = Math.max(shake, 8);
  sfx.playerHit();
  addText(player.x, player.y - 26, '-' + Math.round(d), '#ff5555');
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2, s = 100 + Math.random() * 200;
    particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.25, r: 3, color: '#ff4444', grav: 0, fade: 1 });
  }
  if (player.hp <= 0) {
    player.hp = 0;
    gameState = 'gameover';
    showOverlay();
  }
}

// ================= ZOMBIES =================
function updateZombies(dt) {
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    if (z.hurt > 0) z.hurt -= dt;
    if (z.wob > Math.PI * 2) z.wob = 0;
    z.wob += dt * 6;

    const dx = player.x - z.x, dy = player.y - z.y;
    const dist = Math.hypot(dx, dy) || 1;
    const ux = dx / dist, uy = dy / dist;

    if (z.type === 'spitter') {
      // держит дистанцию и плюётся
      z.spitCd -= dt;
      const want = dist > 300 ? 1 : 0.4;
      z.vx = ux * z.speed * want; z.vy = uy * z.speed * want;
      if (dist < 180 && (Math.random() < 0.4)) { // прочь
        z.vx = -ux * z.speed * 0.8; z.vy = -uy * z.speed * 0.8;
      }
      if (z.spitCd <= 0 && dist < 460 && z.deathT < 0) {
        z.spitCd = 2.4;
        const sa = Math.atan2(dy, dx);
        enemyBullets.push({ x: z.x, y: z.y, vx: Math.cos(sa) * 260, vy: Math.sin(sa) * 260, r: 7, dmg: 10, life: 3, color: '#b06ae0' });
        noise(0.1, 0.08, 2000);
      }
    } else if (z.boss) {
      updateBossAI(z, dt, ux, uy, dist);
    } else if (z.type === 'exploder' && dist < 46) {
      explode(z.x, z.y);
      zombies.splice(i, 1);
      addBlood(z.x, z.y, 5, '#ff9a4a');
      continue;
    } else {
      const ux = dx / dist, uy = dy / dist;
      // беспорядочное блуждание
      z.wanderT -= dt;
      if (z.wanderT <= 0) { z.wanderT = 1.2 + Math.random() * 2; z.wander = (Math.random() - 0.5) * 1.5; }
      const wx = Math.cos(z.wander), wy = Math.sin(z.wander);
      z.vx = (ux + wx * 0.35) * z.speed;
      z.vy = (uy + wy * 0.35) * z.speed;
    }
    z.x += z.vx * dt;
    z.y += z.vy * dt;

    // расталкивание зомби
    for (let j = i - 1; j >= 0; j--) {
      const o = zombies[j];
      const dd = Math.hypot(z.x - o.x, z.y - o.y);
      const rr = z.r + o.r;
      if (dd < rr && dd > 0) {
        const push = (rr - dd) / 2;
        const nx = (z.x - o.x) / dd, ny = (z.y - o.y) / dd;
        z.x += nx * push; z.y += ny * push;
        o.x -= nx * push; o.y -= ny * push;
      }
    }

    // контакт с игроком
    const pd = Math.hypot(player.x - z.x, player.y - z.y);
    if (pd < z.r + PLAYER_R && z.deathT < 0) {
      if (z.type === 'exploder') { explode(z.x, z.y); zombies.splice(i, 1); addBlood(z.x, z.y, 5, '#ff9a4a'); continue; }
      damagePlayer(z.dmg);
    }
  }
  // удаление трупов после анимации
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    if (z.deathT > 0) {
      z.deathT -= dt;
      if (z.deathT <= 0) zombies.splice(i, 1);
    }
  }
}

function updateBossAI(z, dt, ux, uy, dist) {
  z.atkT -= dt;
  if (z.bKind === 'spitter') {
    const want = dist > 360 ? 1 : (dist < 280 ? -0.7 : 0.5);
    z.vx = ux * z.speed * want; z.vy = uy * z.speed * want;
    if (z.pendingAtk === null && z.atkT <= 0 && dist < 560) {
      z.atkT = 2.6;
      z.telegraph = 0.55;
      z.pendingAtk = 'spit';
    }
  } else {
    z.vx = ux * z.speed; z.vy = uy * z.speed;
    if (z.pendingAtk === null && z.atkT <= 0 && dist < 300) {
      z.atkT = 3.4;
      z.telegraph = 0.7;
      z.pendingAtk = 'slam';
    }
  }
  if (z.telegraph > 0) {
    z.telegraph -= dt;
    if (z.telegraph <= 0 && z.pendingAtk) {
      const kind = z.pendingAtk;
      z.pendingAtk = null;
      if (kind === 'spit' && z.deathT < 0) {
        const base = Math.atan2(player.y - z.y, player.x - z.x);
        for (let k = 0; k < 5; k++) {
          const a = base + (k - 2) * 0.12;
          enemyBullets.push({ x: z.x + Math.cos(a) * z.r, y: z.y + Math.sin(a) * z.r, vx: Math.cos(a) * 330, vy: Math.sin(a) * 330, r: 9, dmg: 13, life: 3.5, color: '#c47ae8' });
        }
        noise(0.25, 0.15, 2200);
        shake = Math.max(shake, 4);
      } else if (kind === 'slam' && z.deathT < 0) {
        const n = 14;
        for (let k = 0; k < n; k++) {
          const a = (k / n) * Math.PI * 2;
          enemyBullets.push({ x: z.x + Math.cos(a) * z.r, y: z.y + Math.sin(a) * z.r, vx: Math.cos(a) * 185, vy: Math.sin(a) * 185, r: 10, dmg: 15, life: 2.6, color: '#7fe07f' });
        }
        sfx.explode();
        shake = Math.max(shake, 9);
        flash = Math.max(flash, 0.08);
      }
    }
  }
}

function damageZombie(z, dmg, src) {
  if (z.deathT >= 0) return;
  z.hp -= dmg;
  z.hurt = 0.08;
  addBlood(z.x, z.y, 3 + Math.min(6, dmg / 10), z.color);
  if (z.hp <= 0) {
    killZombie(z, src);
  }
}

function killZombie(z, src) {
  z.deathT = z.boss ? 1.2 : 0.45; // анимация гибели
  z.vx = 0; z.vy = 0; z.hp = 0;
  kills++;
  score += z.score;
  addText(z.x, z.y - 30, '+' + z.score, '#ffd25e');
  addBlood(z.x, z.y, z.boss ? 40 : 10, z.color);
  decals.push({ x: z.x, y: z.y, r: z.r * 1.6, color: z.color, life: 60 });
  if (decals.length > 120) decals.shift();
  sfx.zombieDie();
  if (z.boss) {
    bossDeath();
    return;
  }
  // дроп
  rollDrop(z);
}

function bossDeath() {
  shake = Math.max(shake, 16);
  flash = Math.max(flash, 0.18);
  sfx.explode();
  sfx.explode();
  // волна взрывов-частиц
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 500;
    particles.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.6, r: 3 + Math.random() * 5, color: Math.random() < 0.5 ? boss.color : '#ffd25e', grav: 0, fade: 1 });
  }
  // гарантированный дроп вокруг босса
  const dropOff = (i) => {
    const a = (i / 8) * Math.PI * 2;
    return { x: boss.x + Math.cos(a) * (boss.r + 8), y: boss.y + Math.sin(a) * (boss.r + 8) };
  };
  pickups.push({ type: 'medkit', x: dropOff(0).x, y: dropOff(0).y, r: 11 });
  pickups.push({ type: 'ammo', x: dropOff(1).x, y: dropOff(1).y, r: 11 });
  pickups.push({ type: 'ammo', x: dropOff(2).x, y: dropOff(2).y, r: 11 });
  pickups.push({ type: 'grenade', x: dropOff(3).x, y: dropOff(3).y, r: 11 });
  pickups.push({ type: 'grenade', x: dropOff(4).x, y: dropOff(4).y, r: 11 });
  const heal = Math.min(50, player.maxHp - player.hp);
  player.hp += heal;
  addText(boss.x, boss.y - boss.r - 20, 'БОСС ПОВЕРЖЕН! +' + Math.round(heal) + ' HP', '#7dff7d', );
  setTimeout(() => { blip(392, 0.2, 'triangle', 0.2); setTimeout(() => blip(523, 0.3, 'triangle', 0.2), 180); }, 200);
  boss = null;
}

function rollDrop(z) {
  const r = Math.random();
  if (r < 0.10) {
    pickups.push({ type: 'medkit', x: z.x, y: z.y, r: 11 });
  } else if (r < 0.24) {
    pickups.push({ type: 'ammo', x: z.x, y: z.y, r: 11 });
  } else if (r < 0.34) {
    pickups.push({ type: 'grenade', x: z.x, y: z.y, r: 11 });
  }
}

function applyPickup(p) {
  if (p.type === 'medkit') {
    const heal = Math.min(45, player.maxHp - player.hp);
    player.hp += heal;
    addText(p.x, p.y - 16, '+' + Math.round(heal) + ' HP', '#7dff7d');
  } else if (p.type === 'ammo') {
    player.reloading = false;
    player.reloadT = 0;
    player.mag = player.magMax;
    addText(p.x, p.y - 16, 'МАГАЗИН ПОЛНЫЙ', '#ffd25e');
  } else if (p.type === 'grenade') {
    player.grenades += 1;
    addText(p.x, p.y - 16, '+1 граната', '#ff9a4a');
  }
}

// ================= BULLETS / PROJECTILES =================
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.life <= 0 || b.x < 0 || b.y < 0 || b.x > WORLD || b.y > WORLD) {
      if (b.x >= 0 && b.y >= 0 && b.x <= WORLD && b.y <= WORLD && b.life > 0) {
        particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.15, r: 2, color: '#ccc', grav: 0, fade: 1 });
      }
      bullets.splice(i, 1);
      continue;
    }
    // стенки
    if (b.x < 0 || b.x > WORLD || b.y < 0 || b.y > WORLD) { bullets.splice(i, 1); continue; }
    // столкновения с зомби
    for (let j = 0; j < zombies.length; j++) {
      const z = zombies[j];
      if (z.deathT >= 0) continue;
      const d = Math.hypot(b.x - z.x, b.y - z.y);
      if (d < z.r + b.r) {
        damageZombie(z, b.dmg, 'bullet');
        bullets.splice(i, 1);
        break;
      }
    }
  }
  // снаряды зомби
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.life -= dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.life <= 0 || b.x < 0 || b.y < 0 || b.x > WORLD || b.y > WORLD) {
      if (b.x >= 0 && b.y >= 0 && b.x <= WORLD && b.y <= WORLD) {
        particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.2, r: 4, color: b.color, grav: 0, fade: 1 });
      }
      enemyBullets.splice(i, 1); continue;
    }
    const d = Math.hypot(b.x - player.x, b.y - player.y);
    if (d < PLAYER_R + b.r && player.invuln <= 0) {
      damagePlayer(b.dmg);
      enemyBullets.splice(i, 1);
    }
  }
}

function updateGrenades(dt) {
  for (let i = grenades.length - 1; i >= 0; i--) {
    const g = grenades[i];
    g.fuse -= dt;
    g.vx *= (1 - dt * 0.8); g.vy *= (1 - dt * 0.8);
    g.x += g.vx * dt; g.y += g.vy * dt;
    // рикошет от стенок мира
    if (g.x < 6 || g.x > WORLD - 6) { g.vx *= -0.5; g.x = Math.max(6, Math.min(WORLD - 6, g.x)); g.fuse = Math.min(g.fuse, 0.5); }
    if (g.y < 6 || g.y > WORLD - 6) { g.vy *= -0.5; g.y = Math.max(6, Math.min(WORLD - 6, g.y)); g.fuse = Math.min(g.fuse, 0.5); }
    // контакт с зомби — взрыв раньше (при выстреле в упор... нет, только по таймеру, но ускоряем)
    for (let j = 0; j < zombies.length; j++) {
      const z = zombies[j];
      if (z.deathT >= 0) continue;
      if (Math.hypot(g.x - z.x, g.y - z.y) < z.r + 8) { g.fuse = Math.min(g.fuse, 0.15); break; }
    }
    if (g.fuse <= 0) {
      explode(g.x, g.y);
      grenades.splice(i, 1);
    }
  }
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.life -= dt;
    e.r = e.maxR * (1 - Math.pow(1 - (0.4 - e.life) / 0.4, 2));
    if (e.r <= 0) e.r = 1;
    if (e.life <= 0) explosions.splice(i, 1);
  }
}

// ================= FX =================
function addBlood(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 30 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3 + Math.random() * 0.5, r: 1.5 + Math.random() * 3, color, grav: -60, fade: 1 });
  }
}
function addText(x, y, txt, color) {
  texts.push({ x, y, txt, color, life: 1.1, big: false });
}
function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.grav) p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - dt * 2); p.vy *= (1 - dt * 2);
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt; t.y -= dt * 40;
    if (t.life <= 0) texts.splice(i, 1);
  }
  for (let i = decals.length - 1; i >= 0; i--) {
    decals[i].life -= dt;
    if (decals[i].life <= 0) decals.splice(i, 1);
  }
  shake = Math.max(0, shake - dt * 30);
  flash = Math.max(0, flash - dt * 4);
}

// ================= CAMERA =================
const cam = { x: 0, y: 0 };
function updateCamera(dt) {
  const tx = player.x - W / 2;
  const ty = player.y - H / 2;
  cam.x += (tx - cam.x) * Math.min(1, dt * 8);
  cam.y += (ty - cam.y) * Math.min(1, dt * 8);
}

// ================= RENDER =================
function render() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  ctx.translate(-cam.x, -cam.y);

  drawWorld();
  drawPickups();
  drawExplosions();
  drawEnemyBullets();
  drawGrenades();
  drawZombies();
  drawPlayer();
  drawBullets();
  drawParticles();
  drawDecals();
  drawTexts();

  ctx.restore();

  drawHUD();
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + flash + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (player && player.invuln > 0) {
    ctx.fillStyle = 'rgba(255,0,0,' + (player.invuln / 0.4) * 0.08 + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawWorld() {
  const gs = 96;
  const x0 = Math.floor(cam.x / gs) * gs;
  const y0 = Math.floor(cam.y / gs) * gs;
  const x1 = cam.x + W + gs;
  const y1 = cam.y + H + gs;

  // базовая трава на весь видимый экран (и за краями мира — без пустот)
  ctx.fillStyle = '#55803f';
  ctx.fillRect(x0, y0, x1 - x0, y1 - y0);

  for (let gx = Math.floor(x0 / gs); gx < Math.ceil(x1 / gs); gx++)
  for (let gy = Math.floor(y0 / gs); gy < Math.ceil(y1 / gs); gy++) {
    const h = ((gx * 73856093) ^ (gy * 19349663)) >>> 0;
    const px = gx * gs, py = gy * gs;

    // чередование оттенков травы (пятна)
    if (h % 3 === 0) {
      ctx.fillStyle = 'rgba(52,102,36,0.35)';
    } else if (h % 5 === 0) {
      ctx.fillStyle = 'rgba(96,150,60,0.25)';
    } else {
      ctx.fillStyle = 'rgba(68,124,44,0.18)';
    }
    ctx.fillRect(px, py, gs, gs);

    // травинки
    ctx.strokeStyle = 'rgba(140,210,100,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let b = 0; b < 6; b++) {
      const bx = px + 8 + ((h >> (b * 3)) % 80) / 100 * (gs - 16);
      const by = py + 8 + ((h >> (b * 3 + 1)) % 80) / 100 * (gs - 16);
      const hgt = 4 + (h >> b) % 7;
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + 1, by - hgt);
    }
    ctx.stroke();

    // редкая тёмная проплешина
    if (h % 7 === 0) {
      ctx.fillStyle = 'rgba(30,60,20,0.25)';
      ctx.beginPath();
      ctx.ellipse(px + (h >> 4) % gs, py + (h >> 9) % gs, 18 + (h >> 2) % 14, 12 + h % 8, (h % 30) * 0.1, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawZombie(z) {
  const ox = Math.sin(z.wob) * 2;
  ctx.save();
  ctx.translate(z.x, z.y);

  if (z.deathT >= 0) {
    // труп
    const a = Math.PI / 2;
    ctx.globalAlpha = Math.max(0, z.deathT / (z.boss ? 1.2 : 0.45));
    ctx.rotate(a);
    ctx.fillStyle = z.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, z.r, z.r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }

  // босс: телеграф атаки
  if (z.boss && z.telegraph > 0) {
    const pr = (1 - z.telegraph / (z.pendingAtk === 'slam' ? 0.7 : 0.55));
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = z.bKind === 'spitter' ? '#e09aff' : '#ffe0a0';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, z.r + 14, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.globalAlpha = 0.35 + Math.sin(time * 30) * 0.2;
    ctx.beginPath(); ctx.arc(0, 0, z.r + 8 + pr * 14, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // тень
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, z.r * 0.6, z.r * 1.1, z.r * 0.5, 0, 0, Math.PI * 2); ctx.fill();

  // босс: шипы-корона
  if (z.boss) {
    ctx.fillStyle = z.hurt > 0 ? '#fff' : darken(z.color, 0.55);
    const spikes = 8;
    for (let s = 0; s < spikes; s++) {
      const sa = (s / spikes) * Math.PI * 2 + z.wob * 0.1;
      ctx.save();
      ctx.rotate(sa);
      ctx.beginPath();
      ctx.moveTo(-z.r * 0.12, -z.r * 0.7);
      ctx.lineTo(0, -z.r * 1.45);
      ctx.lineTo(z.r * 0.12, -z.r * 0.7);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // корона-гребень
    ctx.fillStyle = z.hurt > 0 ? '#fff' : '#c73b3b';
    ctx.beginPath();
    ctx.moveTo(-z.r * 0.6, -z.r * 1.0);
    ctx.lineTo(-z.r * 0.25, -z.r * 1.6);
    ctx.lineTo(z.r * 0.15, -z.r * 1.15);
    ctx.lineTo(z.r * 0.45, -z.r * 1.5);
    ctx.lineTo(z.r * 0.65, -z.r * 1.0);
    ctx.closePath(); ctx.fill();
  }

  // тело
  ctx.fillStyle = z.hurt > 0 ? '#ffffff' : z.color;
  ctx.beginPath(); ctx.arc(ox, 0, z.r, 0, Math.PI * 2); ctx.fill();
  // блик
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.arc(ox - z.r * 0.3, -z.r * 0.3, z.r * 0.35, 0, Math.PI * 2); ctx.fill();

  // полоска HP для сильных
  if (z.type === 'brute' || z.boss || z.hp < z.maxHp * 0.6) {
    const w = z.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-w / 2, -z.r - 12, w, 4);
    ctx.fillStyle = '#7dff7d';
    ctx.fillRect(-w / 2, -z.r - 12, w * Math.max(0, z.hp / z.maxHp), 4);
  }

  // ноги-руки (дрожащее покачивание)
  ctx.strokeStyle = z.hurt > 0 ? '#fff' : darken(z.color, 0.6);
  ctx.lineWidth = 3 + z.r * 0.08;
  const step = Math.sin(z.wob * 2) * 4;
  ctx.beginPath();
  ctx.moveTo(-z.r * 0.6, step);
  ctx.lineTo(-z.r * 1.2, step * 1.4);
  ctx.moveTo(z.r * 0.6, -step);
  ctx.lineTo(z.r * 1.2, -step * 1.4);
  ctx.moveTo(-z.r * 0.8, -z.r * 0.5);
  ctx.lineTo(-z.r * 1.5 + ox, -z.r * 1.0);
  ctx.moveTo(z.r * 0.8, -z.r * 0.5);
  ctx.lineTo(z.r * 1.5 + ox, -z.r * 1.0);
  ctx.stroke();

  // глаза
  const look = Math.atan2(player.y - z.y, player.x - z.x);
  ctx.fillStyle = '#ff2222';
  for (const ex of [-0.35, 0.35]) {
    const exx = ox + Math.cos(look) * 3 + ex * z.r;
    const ey = Math.sin(look) * 3 + Math.sin(z.wob * 0.5) * 1;
    ctx.beginPath(); ctx.arc(exx, ey - z.r * 0.15, z.r * 0.16, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.arc(ox, 0, z.r * 0.2, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function darken(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.floor((n >> 16 & 255) * f), g = Math.floor((n >> 8 & 255) * f), b = Math.floor((n & 255) * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawZombies() {
  // сортируем по y для наложения
  const sorted = zombies.slice().sort((a, b) => a.y - b.y);
  for (const z of sorted) drawZombie(z);
}

function drawPlayer() {
  const p = player;
  ctx.save();
  ctx.translate(p.x, p.y);

  if (p.invuln > 0 && Math.floor(time * 30) % 2 === 0) ctx.globalAlpha = 0.5;

  // тень
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, 22, 16, 8, 0, 0, Math.PI * 2); ctx.fill();

  // ноги-бег
  const mv = Math.hypot(p.vx, p.vy);
  const sw = mv > 20 ? Math.sin(time * 14) * 6 : 0;
  ctx.strokeStyle = '#2f4a8a'; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-6, 12); ctx.lineTo(-6 + sw, 18);
  ctx.moveTo(6, 12); ctx.lineTo(6 - sw, 18);
  ctx.stroke();

  // оружие (за спиной, затем тело)
  const a = p.angle;
  ctx.save();
  ctx.rotate(a);
  ctx.fillStyle = '#40382e';
  ctx.fillRect(8, -3.5, 20, 7);
  ctx.fillStyle = '#2a241c';
  ctx.fillRect(14, -5, 6, 10); // магазин
  if (p.fireAnim > 0) {
    // вспышка
    ctx.fillStyle = 'rgba(255,220,120,' + (p.fireAnim / 0.07) + ')';
    ctx.beginPath();
    ctx.moveTo(28, -1);
    ctx.lineTo(40 + Math.random() * 6, -7);
    ctx.lineTo(46 + Math.random() * 4, 0);
    ctx.lineTo(40 + Math.random() * 6, 7);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // руки к автомату
  ctx.strokeStyle = '#3a5a9a'; ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(Math.cos(a) * 10 + 8, Math.sin(a) * 10 + 6);
  ctx.lineTo(Math.cos(a) * 15 + 14, Math.sin(a) * 15 - 1);
  ctx.stroke();

  // тело
  ctx.fillStyle = '#3f5f9f';
  ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.arc(-5, -5, 5, 0, Math.PI * 2); ctx.fill();

  // шлем/голова
  ctx.fillStyle = '#efe3d0';
  ctx.beginPath(); ctx.arc(Math.cos(a) * 4, Math.sin(a) * 4, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2f4a8a';
  ctx.beginPath(); ctx.arc(Math.cos(a) * 5 + 2, Math.sin(a) * 5 - 4, 7, Math.PI * 0.9, Math.PI * 1.5); ctx.fill();

  // "раненые" индикатор
  if (p.hp < p.maxHp * 0.3) {
    ctx.strokeStyle = 'rgba(255,60,60,' + (0.4 + Math.sin(time * 6) * 0.3) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 20, p.angle - Math.PI, p.angle); ctx.stroke();
  }
  ctx.restore();
}

function drawBullets() {
  ctx.fillStyle = '#ffe9a8';
  for (const b of bullets) {
    const d = Math.hypot(b.vx, b.vy) || 1;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.fillRect(-6, -1.5, 12, 3);
    ctx.restore();
  }
}

function drawEnemyBullets() {
  for (const b of enemyBullets) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = b.color;
    ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(0, 0, b.r * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawGrenades() {
  for (const g of grenades) {
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.fillStyle = '#2c2c2c';
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4c4c4c';
    ctx.beginPath(); ctx.arc(0, 0, 7, -Math.PI / 2, Math.PI / 2); ctx.fill();
    ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.stroke();
    if (g.fuse < 0.55 && Math.floor(g.fuse * 12) % 2 === 0) {
      ctx.fillStyle = '#ff3333';
    } else ctx.fillStyle = '#888';
    ctx.beginPath(); ctx.arc(0, -4, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawExplosions() {
  for (const e of explosions) {
    const a = Math.max(0, e.life / 0.4);
    const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
    grad.addColorStop(0, 'rgba(255,255,220,' + a + ')');
    grad.addColorStop(0.4, 'rgba(255,180,80,' + a * 0.8 + ')');
    grad.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawPickups() {
  for (const p of pickups) {
    ctx.save();
    ctx.translate(p.x, p.y);
    const bob = Math.sin(time * 4 + p.x) * 2;
    ctx.translate(0, bob);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 6, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
    if (p.type === 'medkit') {
      ctx.fillStyle = '#fff';
      roundRect(ctx, -9, -7, 18, 14, 3); ctx.fill();
      ctx.fillStyle = '#c73b3b';
      ctx.fillRect(-2, -5, 4, 10);
      ctx.fillRect(-6, -1, 12, 4);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.stroke();
    } else if (p.type === 'ammo') {
      ctx.fillStyle = '#e8c34a';
      roundRect(ctx, -7, -7, 14, 14, 2); ctx.fill();
      ctx.fillStyle = '#b8912a';
      roundRect(ctx, -7, -3, 14, 6, 1); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px arial'; ctx.textAlign = 'center';
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.stroke();
    } else if (p.type === 'grenade') {
      ctx.fillStyle = '#2c2c2c';
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.2));
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
}

function drawDecals() {
  for (const d of decals) {
    ctx.globalAlpha = Math.min(0.55, d.life / 40 * 0.55 + 0.15);
    ctx.fillStyle = d.color;
    ctx.beginPath();
    const n = 7;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + d.x;
      const rr = d.r * (0.5 + ((d.x * 7 + i * 31) % 10) / 20);
      const px = d.x + Math.cos(a) * rr;
      const py = d.y + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  for (const t of texts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life));
    ctx.font = (t.big ? 'bold 34px' : 'bold 14px') + ' arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(t.txt, t.x + 2, t.y + 2);
    ctx.fillStyle = t.color;
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawHUD() {
  if (!player || gameState === 'menu') return;

  // полоса HP босса (по центру верха)
  if (boss && boss.deathT < 0) {
    const bw = Math.min(560, W - 260);
    const bx = (W - bw) / 2, by = 22;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    roundRect(ctx, bx - 6, by - 24, bw + 12, 44, 8); ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px arial';
    ctx.fillStyle = '#ff8a8a';
    ctx.fillText(boss.name + ' — уровень ' + bossLevel, W / 2, by - 2);
    ctx.fillStyle = 'rgba(90,0,0,0.8)';
    roundRect(ctx, bx, by + 6, bw, 16, 4); ctx.fill();
    const bossFrac = Math.max(0, boss.hp / boss.maxHp);
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, '#e04343'); grad.addColorStop(1, '#ffb45e');
    ctx.fillStyle = grad;
    roundRect(ctx, bx, by + 6, Math.max(2, bw * bossFrac), 16, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    roundRect(ctx, bx, by + 6, bw, 16, 4); ctx.stroke();
    ctx.textAlign = 'left';
  }

  // ПАНЕЛЬ ВЕРХ
  const barW = 260;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(ctx, 16, 14, barW + 8, 70, 10); ctx.fill();

  // HP
  ctx.textAlign = 'left';
  ctx.font = '12px arial';
  ctx.fillStyle = '#ccc';
  ctx.fillText('ЖИЗНИ', 28, 32);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(ctx, 28, 38, barW - 14, 14, 4); ctx.fill();
  const hpGrad = ctx.createLinearGradient(28, 0, 28 + barW, 0);
  hpGrad.addColorStop(0, '#e04343'); hpGrad.addColorStop(1, '#7dff7d');
  ctx.fillStyle = player.hp > 30 ? '#6bd05e' : '#e04343';
  roundRect(ctx, 28, 38, Math.max(2, (barW - 14) * (player.hp / player.maxHp)), 14, 4); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.max(0, Math.ceil(player.hp)) + '/' + player.maxHp, barW - 40, 62);

  ctx.font = 'bold 13px arial';
  ctx.fillStyle = '#ffd25e';
  ctx.fillText('ВОЛНА ' + wave, W - 190, 34);
  ctx.fillStyle = '#fff';
  ctx.fillText('Счёт: ' + score, W - 190, 56);
  ctx.fillStyle = '#cfc';
  ctx.fillText('Убийств: ' + kills, W - 190, 76);

  // статус волны
  const left = zombies.length + spawnQueue.length;
  ctx.font = '12px arial';
  ctx.fillStyle = left > 0 ? '#ff9a6a' : '#6bd05e';
  ctx.fillText(left > 0 ? 'Зомби осталось: ' + left : (waveActive ? 'Зачищено!' : 'Новая волна...'), 28, 100);

  // НИЖНЯЯ ПАНЕЛЬ — амуниция
  const ammoW = 300;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(ctx, 16, H - 76, ammoW, 60, 10); ctx.fill();

  ctx.font = 'bold 20px arial';
  ctx.fillStyle = player.mag === 0 ? '#e04343' : '#fff';
  ctx.textAlign = 'left';
  ctx.fillText((player.reloading ? '…' : player.mag) + ' / ' + MAG_SIZE, 32, H - 40);
  ctx.font = 'bold 15px arial';
  ctx.fillStyle = '#9fc47a';
  ctx.fillText('∞ патроны', 150, H - 40);
  if (player.reloading) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    roundRect(ctx, 32, H - 34, (ammoW - 60) * (1 - player.reloadT / 1.1), 4, 2); ctx.fill();
    ctx.fillStyle = '#ffd25e';
    ctx.font = 'bold 11px arial';
    ctx.fillText('ПЕРЕЗАРЯДКА…', 32, H - 46);
    ctx.font = '13px arial';
  } else {
    ctx.font = '11px arial';
    ctx.fillStyle = player.mag === 0 ? '#e04343' : '#666';
    ctx.fillText(player.mag === 0 ? 'Нажми R' : 'R', 32, H - 46);
  }

  // гранаты
  ctx.font = 'bold 14px arial';
  ctx.fillStyle = '#ffb45e';
  ctx.fillText('💣 ' + player.grenades, 206, H - 36);
  ctx.font = '11px arial'; ctx.fillStyle = '#666';
  ctx.fillText('G', 206, H - 50);

  ctx.textAlign = 'left';
}

// ================= OVERLAY =================
const overlay = document.getElementById('overlay');
const sub = document.getElementById('ov-sub');
function showOverlay() {
  if (gameState === 'gameover') {
    sub.innerHTML = 'Конец. Ты продержался до <b>волны ' + wave + '</b>.<br>Счёт: <b>' + score + '</b> · Убийств: <b>' + kills + '</b>';
    document.getElementById('startBtn').textContent = 'ЗАНОВО';
  }
  overlay.classList.remove('hidden');
}
function hideOverlay() {
  overlay.classList.add('hidden');
}

document.getElementById('startBtn').addEventListener('click', () => {
  audio();
  resetGame();
  gameState = 'play';
  hideOverlay();
});

// ================= GAME LOOP =================
let last = performance.now();
let tick = 0;
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  time += dt;
  tick++;
  requestAnimationFrame(loop);

  if (gameState !== 'play') { return; }

  updatePlayer(dt);
  updateZombies(dt);
  updateBullets(dt);
  updateGrenades(dt);
  updateWave(dt);
  updateFx(dt);
  updateCamera(dt);

  render();
}

// лёгкий превью рендер в меню
(function menuBackdrop() {
  let t = 0;
  const loop = () => {
    if (gameState === 'play') return;
    t += 1;
    ctx.fillStyle = '#141210';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(224,67,67,0.12)';
    for (let i = 0; i < 40; i++) {
      const x = ((i * 137 + t * 2) % (W + 80)) - 40;
      const y = ((i * 71 + t) % (H + 80)) - 40;
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    }
    // мертвецы на фоне
    for (let i = 0; i < 6; i++) {
      const x = W * (0.12 + i * 0.15);
      const y = H * 0.82 + Math.sin(t * 0.01 + i) * 20;
      ctx.fillStyle = '#3f6a35';
      ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5f9e4f';
      ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff2222';
      ctx.beginPath();
      ctx.arc(x - 4, y - 3, 3, 0, Math.PI * 2);
      ctx.arc(x + 4, y - 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();

// стартовое состояние
resetGame();
gameState = 'menu';
showOverlay();
requestAnimationFrame(loop);
</script>
